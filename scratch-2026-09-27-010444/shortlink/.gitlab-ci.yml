# Конвейер: lint -> build -> push -> deploy.
# Каждое задание вызывает ci/run-stage.sh — те же команды, что и при локальном прогоне.
stages:
  - lint
  - build
  - push
  - deploy

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  # В GitLab образ уходит в реестр проекта; на стенде — в свой реестр localhost:5000.
  REGISTRY: $CI_REGISTRY/$CI_PROJECT_PATH
  GIT_DEPTH: "0"  # нужны теги для вычисления версии образа

.docker:
  image: docker:27.3.1
  services:
    - docker:27.3.1-dind
  before_script:
    - apk add --no-cache bash git curl
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

lint:
  stage: lint
  image: python:3.12.6-slim-bookworm
  before_script:
    - bash ci/install-lint-tools.sh
  script:
    - ./ci/run-stage.sh lint

build:
  stage: build
  extends: .docker
  script:
    - ./ci/run-stage.sh build
  artifacts:
    paths:
      - .build/shortlink-image.tar
    expire_in: 1 day

push:
  stage: push
  extends: .docker
  needs: [build]
  script:
    - ./ci/run-stage.sh push

# Деплой — только по тегу вида vX.Y.Z (релиз), а не на каждый коммит:
# каждый коммит проверяется и собирается, но в кластер попадает только осознанно
# выпущенная версия, и её тег совпадает с тегом образа — есть куда откатиться.
# KUBECONFIG — переменная проекта типа File; без неё задание не создаётся
# (учебный k3d-кластер из GitLab.com недоступен, деплой идёт через run-stage.sh на стенде).
deploy:
  stage: deploy
  image: alpine:3.20.3
  needs: [push]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $KUBECONFIG'
  before_script:
    - apk add --no-cache bash git openssl kubectl
  script:
    - ./ci/run-stage.sh deploy
