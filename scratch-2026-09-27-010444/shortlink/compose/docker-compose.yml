# Локальный стек: приложение + PostgreSQL.
# Запуск: docker compose -f compose/docker-compose.yml up -d  (или scripts/bootstrap.sh)
# Значения берутся из compose/.env; пустые значения заменяются дефолтами ниже (${VAR:-default}).
name: shortlink

services:
  db:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-shortlink}
      POSTGRES_USER: ${DB_USER:-shortlink}
      # Пароль не переменной, а файлом-секретом: в compose-файле и в `docker inspect` его нет.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ../app
      args:
        VERSION: ${APP_VERSION:-dev}
    image: ${REGISTRY:-localhost:5000}/shortlink:${APP_VERSION:-dev}
    restart: unless-stopped
    environment:
      APP_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DB_HOST: db  # имя сервиса, резолвит встроенный DNS Docker-сети
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-shortlink}
      DB_USER: ${DB_USER:-shortlink}
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "${HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy  # ждём готовности базы, а не просто запуска контейнера

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt  # создаёт scripts/bootstrap.sh, в Git не попадает
