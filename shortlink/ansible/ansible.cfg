[defaults]
inventory = inventory/hosts.yml
roles_path = roles
# Стенды пересоздаются, и ключи хостов меняются. В учебной среде отключаем проверку,
# в production — известные ключи в known_hosts.
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
