---
# Замените адреса и пользователя на выданные на стенде Ansible.
# Две группы с разными значениями переменных — см. group_vars/staging.yml и production.yml.
shortlink_nodes:
  vars:
    # Пользователь стенда с sudo, НЕ root: роль закрывает вход root по SSH,
    # и второй прогон под root уже не подключится. После первого прогона можно
    # ходить под служебным пользователем: -e ansible_user=deploy.
    ansible_user: student
  children:
    staging:
      hosts:
        node1:
          ansible_host: 10.0.0.11
    production:
      hosts:
        node2:
          ansible_host: 10.0.0.12
