# Несекретные настройки. Пароль — в Secret shortlink-db (ключ password).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shortlink-config
data:
  APP_PORT: "8080"
  LOG_LEVEL: INFO
  DB_HOST: postgres  # имя Service, резолвит CoreDNS: postgres.shortlink.svc.cluster.local
  DB_PORT: "5432"
  DB_NAME: shortlink
  DB_USER: shortlink
